# Site settings

title: "Hangyeong.dev"
description: ""
author: "Hangyeong"
lang: "ko"
timezone: "Asia/Seoul"
url: "https://han-gyeong.github.io"
baseurl: ""

# Build settings
markdown: kramdown
permalink: /:categories/:title/
excerpt_separator: \"<!--more-->\"

# Defaults
collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Hangyeong"

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - templates
